# Version bump type: patch, minor, major, hotfix, or prerelease
bump = "patch"
# Short description of this release (required)
description = "Safety net for non-serializable tool results"
# Optional context explaining why these changes were made
context = "Tool handlers that return non-JSON-serializable objects (dataclasses, custom response objects) previously crashed json.dumps during the tool-calling loop. Now falls back to repr() with a logged warning."
# Pre-release identifier: alpha, beta, rc, or stable
# preid = ""
# Set to true to generate a blog post for this release
# blog = false
include = ["pypi"]
exclude = []
