[project]
name = "openstream"
version = "0.1.0"
requires-python = ">=3.11"
description = "Python SDK for opencode's JSON streaming protocol"

dependencies = ["httpx"]
keywords = ["rlsbl"]

[project.scripts]
openstream-stop = "openstream._stop:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openstream"]

[dependency-groups]
dev = ["pytest", "pytest-asyncio"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib -m 'not slow'"
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
asyncio_mode = "auto"
